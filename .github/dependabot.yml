# Dependabot configuration.
#
# The repository previously had none, which is why alerts accumulated
# unattended and why a stale nested lockfile
# (packages/plugin-rest-cache/yarn.lock, deleted) kept reporting findings for a
# dependency tree that had not been installed since September 2025.
#
# Two things worth knowing when triaging alerts here:
#
#   1. The published packages have a very small runtime surface - chalk, debug,
#      immer, prop-types, cache-manager, keyv, quick-lru and @keyv/redis. Almost
#      every alert on this repository is against development tooling or the
#      playground Strapi applications, neither of which ship to users.
#   2. The playgrounds pin Strapi deliberately, so bumps there are a testing
#      decision, not a security one. They are grouped separately for that
#      reason.
version: 2

updates:
  # `npm` is the correct ecosystem for pnpm too - dependabot reads
  # pnpm-lock.yaml under it.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    labels:
      - "source: dependencies"
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Runtime dependencies of the published packages. These are the ones that
      # actually reach users, so keep them in their own PR and review properly.
      #
      # Majors are included deliberately. Leaving them out does not stop them -
      # it just means they arrive as ungrouped single PRs with no label and no
      # context, which is exactly how a chalk 4 -> 6 bump landed on a
      # production dependency. chalk 5+ is ESM-only and would have broken the
      # CommonJS server build.
      production-dependencies:
        dependency-type: production
        update-types:
          - major
          - minor
          - patch

      # Strapi moves fast and the playgrounds pin exact versions; batch these so
      # an upgrade is one reviewable change rather than a dozen.
      strapi:
        patterns:
          - "@strapi/*"
          - "@strapi-community/*"

      # Docs, build, lint and benchmark tooling. Noisy, low risk, safe to batch.
      # Majors included for the same reason as above: an ungrouped major is
      # harder to review, not easier.
      dev-tooling:
        dependency-type: development
        exclude-patterns:
          - "@strapi/*"
          - "@strapi-community/*"
        update-types:
          - major
          - minor
          - patch

    ignore:
      # Majors for these are migrations, not upgrades - they change build
      # output or test semantics and need to be done deliberately.
      - dependency-name: "@strapi/sdk-plugin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "lerna"
        update-types: ["version-update:semver-major"]

      # chalk 5+ is ESM-only and cannot be require()d from the CommonJS server
      # build. The plugin no longer depends on it, but pinning the constraint
      # documents why, should anything reintroduce it.
      - dependency-name: "chalk"
        update-types: ["version-update:semver-major"]

      # quick-lru 5 lacks the iterator keyv needs, so a downgrade silently
      # breaks all cache invalidation; the v7 line is loaded via dynamic
      # import specifically to keep it working. See #128.
      - dependency-name: "quick-lru"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - "source: dependencies"
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
