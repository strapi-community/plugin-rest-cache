# Dependabot configuration.
#
# The repository previously had none, which is why alerts accumulated
# unattended and why a stale nested lockfile
# (packages/plugin-rest-cache/yarn.lock, deleted) kept reporting findings for a
# dependency tree that had not been installed since September 2025.
#
# Two things worth knowing when triaging alerts here:
#
#   1. The published packages have a very small runtime surface - chalk, debug,
#      immer, prop-types, cache-manager, keyv, quick-lru and @keyv/redis. Almost
#      every alert on this repository is against development tooling or the
#      playground Strapi applications, neither of which ship to users.
#   2. The playgrounds pin Strapi deliberately, so bumps there are a testing
#      decision, not a security one. They are grouped separately for that
#      reason.
version: 2

updates:
  # `npm` is the correct ecosystem for pnpm too - dependabot reads
  # pnpm-lock.yaml under it.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    labels:
      - "source: dependencies"
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Runtime dependencies of the published packages. These are the ones that
      # actually reach users, so keep them in their own PR and review properly.
      #
      # Majors are included deliberately. Leaving them out does not stop them -
      # it just means they arrive as ungrouped single PRs with no label and no
      # context, which is exactly how a chalk 4 -> 6 bump landed on a
      # production dependency. chalk 5+ is ESM-only and would have broken the
      # CommonJS server build.
      production-dependencies:
        dependency-type: production
        update-types:
          - major
          - minor
          - patch

      # Strapi moves fast and the playgrounds pin exact versions; batch these so
      # an upgrade is one reviewable change rather than a dozen.
      strapi:
        patterns:
          - "@strapi/*"
          - "@strapi-community/*"

      # Docs, build, lint and benchmark tooling. Noisy, low risk, safe to batch.
      # Majors included for the same reason as above: an ungrouped major is
      # harder to review, not easier.
      dev-tooling:
        dependency-type: development
        exclude-patterns:
          - "@strapi/*"
          - "@strapi-community/*"
        update-types:
          - major
          - minor
          - patch

    ignore:
      # Majors for these are migrations, not upgrades - they change build
      # output or test semantics and need to be done deliberately.
      - dependency-name: "@strapi/sdk-plugin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]

      # TypeScript 7 is the native port and does not expose the JavaScript
      # compiler API, so ts-jest cannot use it:
      #   The TypeScript compiler "typescript" (version 7.0.2) does not expose
      #   the JavaScript compiler API required by ts-jest
      # Every e2e suite fails to even start. Revisit when ts-jest supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

      # The admin imports Strapi's own RTK Query instance, and Strapi ships
      # @reduxjs/toolkit 1.9.x. This is a devDependency only so declaration
      # emit can name the types; resolving a different major than the one the
      # admin actually runs on is how those types stop matching.
      - dependency-name: "@reduxjs/toolkit"
        update-types: ["version-update:semver-major"]

      # chalk 5+ is ESM-only and cannot be require()d from the CommonJS server
      # build. The plugin no longer depends on it, but pinning the constraint
      # documents why, should anything reintroduce it.
      - dependency-name: "chalk"
        update-types: ["version-update:semver-major"]

      # quick-lru 5 lacks the iterator keyv needs, so a downgrade silently
      # breaks all cache invalidation; the v7 line is loaded via dynamic
      # import specifically to keep it working. See #128.
      - dependency-name: "quick-lru"
        update-types: ["version-update:semver-major"]

      # These are governed by Strapi's peer range, not by us. As of 5.52.0:
      #   react, react-dom     ^17.0.0 || ^18.0.0
      #   react-router-dom     ^6.30.3
      # Offering a major only produces a PR that cannot be merged until Strapi
      # widens its own range.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]

      # @keyv/redis 5 swaps ioredis for @redis/client. The redis provider
      # relies on that adapter's internals - _getNamespace(), namespace,
      # opts.useRedisSets and the SADD/SREM tracking set - which is what makes
      # the single-SMEMBERS enumeration in #131 and the cluster handling in
      # #100 work. That upgrade needs its own branch with the provider tests
      # and cluster check run against it, not a batched bump.
      - dependency-name: "@keyv/redis"
        update-types: ["version-update:semver-major"]

      # react-intl is governed by the admin runtime, not by us. The plugin peers
      # on ^6.0.0 and @strapi/admin bundles 6.6.2, so a major only produces an
      # unmergeable PR - the same situation as react and react-router-dom above.
      - dependency-name: "react-intl"
        update-types: ["version-update:semver-major"]

      # jest majors are already ignored, so jest-cli must be too. Letting it
      # advance alone pairs jest-cli 30 with jest 29.
      - dependency-name: "jest-cli"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - "source: dependencies"
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
