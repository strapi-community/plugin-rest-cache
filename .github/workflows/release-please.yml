# Maintains a rolling "chore: release X.Y.Z" pull request and, when it is
# merged, a DRAFT GitHub Release per package.
#
# This workflow never publishes anything. release-please has no publish code
# path at all - that is why it was chosen. Publishing is `publish.yml`, and it
# only ever runs when a human presses a button.
#
# The draft is deliberate and load-bearing. A Release created with the default
# GITHUB_TOKEN does not trigger other workflows, so an auto-published release
# would silently fail to publish to npm. Requiring a maintainer to press
# "Publish release" both fixes that and is the first of the two human gates.
name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The CLI rather than the action: googleapis/release-please-action has
      # had no commits since 2026-05, while the CLI is current.
      - name: Run release-please
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes release-please@17 release-pr \
            --token "$GITHUB_TOKEN" \
            --repo-url "$GITHUB_REPOSITORY" \
            --config-file release-please-config.json \
            --manifest-file .release-please-manifest.json

          npx --yes release-please@17 github-release \
            --token "$GITHUB_TOKEN" \
            --repo-url "$GITHUB_REPOSITORY" \
            --config-file release-please-config.json \
            --manifest-file .release-please-manifest.json

      # release-please lists the same change twice whenever a pull request was
      # merged with a GitHub merge commit. The merge commit carries the pull
      # request title in its body:
      #
      #   Merge pull request #171 from strapi-community/feat/cache-dashboard
      #
      #   feat: add a cache statistics endpoint for the admin dashboard
      #
      # and release-please parses every conventional commit it finds in a
      # message, so that body line becomes an entry attributed to the merge
      # commit, while the commit on the branch underneath produces an identical
      # one. There is no setting for it: BEGIN_COMMIT_OVERRIDE is keyed on the
      # pull request, so it would suppress both copies, and `changelog-type:
      # github` discards the conventional-commit sections.
      #
      # This runs on every release rather than being hand-fixed once, because
      # release-please regenerates both the branch and the notes on every run.
      # It is a no-op when nothing is duplicated, which is the normal case now
      # that pull requests are squash-merged.
      - name: Tidy the release changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Copied out of the working tree before anything is checked out. The
          # release branch is cut from whatever main was when release-please
          # first opened the pull request, so it does not necessarily contain
          # these scripts - the first run failed with MODULE_NOT_FOUND on the
          # script's own path, immediately after checking out that branch.
          DEDUPE="$RUNNER_TEMP/dedupe-changelog.mjs"
          FOLD="$RUNNER_TEMP/consolidate-prerelease-changelog.mjs"
          cp scripts/dedupe-changelog.mjs "$DEDUPE"
          cp scripts/consolidate-prerelease-changelog.mjs "$FOLD"

          # Asked for rather than hardcoded. The branch name depends on the
          # strategy's component, so it changed from
          # `release-please--branches--main` to
          # `release-please--branches--main--components--monorepo` when
          # `separate-pull-requests: false` was removed - and a hardcoded name
          # does not fail, it silently skips, leaving the changelog untidied.
          RELEASE_BRANCH=$(gh pr list --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("release-please--"))][0].headRefName // empty')

          # 1. The rolling release pull request.
          if [ -n "$RELEASE_BRANCH" ]; then
            echo "release branch: $RELEASE_BRANCH"
            git fetch --quiet origin "$RELEASE_BRANCH"
            git checkout --quiet "$RELEASE_BRANCH"
            # Fold first: a prerelease and the stable release that supersedes it
            # can list the same change, and the deduplicator only compares
            # within one section.
            node "$FOLD" CHANGELOG.md
            node "$DEDUPE" CHANGELOG.md
            if ! git diff --quiet -- CHANGELOG.md; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -q -m "chore: tidy the release changelog" -- CHANGELOG.md
              git push origin "$RELEASE_BRANCH"
            fi
            # Deliberately does not switch back. `git checkout -` aborts if
            # CHANGELOG.md is still dirty, and nothing below needs the working
            # tree - step 2 runs entirely through the API, with the script
            # already copied out to $RUNNER_TEMP.
          fi

          # 2. Any draft release. Its notes are stored separately from
          #    CHANGELOG.md, so deduplicating one does not touch the other, and
          #    the draft is what a maintainer actually reads before pressing
          #    Publish.
          notes=$(mktemp)
          for tag in $(gh release list --limit 20 --json tagName,isDraft \
                        --jq '.[] | select(.isDraft) | .tagName'); do
            gh release view "$tag" --json body --jq .body > "$notes"
            node "$DEDUPE" "$notes"
            gh release edit "$tag" --notes-file "$notes"
          done
