# Node matrix is pinned to 22 by two opposing transitive constraints:
#   - @strapi/utils (Strapi 5.52.0) pins preferred-pm@5.0.0, engines node >=22.13
#   - @strapi/sdk-plugin@5.x, engines node >=18.0.0 <=22.x.x
# That leaves 22.13-22.x as the only viable range. sdk-plugin 6.1.1 drops the
# upper bound, so widening to [22, 24, 26] is unblocked by the SDK v6 migration
# tracked in #134.

name: tests

on:
  workflow_call:
  push:
    branches:
      - main
      - 'dev/**'
  pull_request:
    branches: [main]

jobs:
  linters:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # cache node_modules
      - name: Cache dependencies
        uses: actions/cache@v4
        id: yarn-cache
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      # install dependencies if the cache did not hit
      - name: Install dependencies
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: yarn --frozen-lockfile

      - run: yarn test:lint

  e2e_memory:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # cache node_modules
      - name: Cache dependencies
        uses: actions/cache@v4
        id: yarn-cache
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      # install dependencies if the cache did not hit
      - name: Install dependencies
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: yarn --frozen-lockfile

      - run: yarn postinstall:memory

      - run: yarn build:plugin:rest-cache

      - name: Run Memory e2e tests
        working-directory: playgrounds/memory
        run: yarn test:e2e

  e2e_redis:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22]
    services:
      redis:
        image: bitnami/redis:latest
        env:
          ALLOW_EMPTY_PASSWORD: yes
        ports:
          # Opens tcp port 6379 on the host and service container
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # cache node_modules
      - name: Cache dependencies
        uses: actions/cache@v4
        id: yarn-cache
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      # install dependencies if the cache did not hit
      - name: Install dependencies
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: yarn --frozen-lockfile

      - run: yarn postinstall:redis

      - run: yarn build:plugin:rest-cache

      - name: Run Redis e2e tests
        working-directory: playgrounds/redis
        run: yarn test:e2e
