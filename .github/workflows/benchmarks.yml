# Manual performance benchmarks.
#
# Results always land in the run summary and as artifacts. Updating
# BENCHMARKS.md is opt-in and goes through a pull request rather than a direct
# push, so the numbers get reviewed before they are published.
#
# Optional hardening: create a repository environment named `benchmarks` with
# required reviewers and this workflow will additionally block on approval
# before it runs at all.
name: benchmarks

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Cache provider to benchmark
        type: choice
        options: [both, memory, redis]
        default: both
      duration:
        description: Seconds per scenario
        type: string
        default: "30"
      connections:
        description: Concurrent connections
        type: string
        default: "50"
      pipelining:
        description: Pipelined requests per connection
        type: string
        default: "1"
      update_docs:
        description: Open a PR updating BENCHMARKS.md
        type: boolean
        default: false

# Benchmarks are timing sensitive; never let two runs share a runner pool.
concurrency:
  group: benchmarks
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      providers: ${{ steps.plan.outputs.providers }}
    steps:
      - id: plan
        env:
          PROVIDER: ${{ inputs.provider }}
          DURATION: ${{ inputs.duration }}
          CONNECTIONS: ${{ inputs.connections }}
          PIPELINING: ${{ inputs.pipelining }}
        run: |
          # workflow_dispatch string inputs reach a shell, so validate them as
          # plain integers rather than trusting the form.
          for pair in "duration:$DURATION" "connections:$CONNECTIONS" "pipelining:$PIPELINING"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            if ! printf '%s' "$value" | grep -Eq '^[0-9]+$'; then
              echo "::error::$name must be a positive integer, got '$value'"
              exit 1
            fi
          done

          case "$PROVIDER" in
            both)   echo 'providers=["memory","redis"]' >> "$GITHUB_OUTPUT" ;;
            memory) echo 'providers=["memory"]'         >> "$GITHUB_OUTPUT" ;;
            redis)  echo 'providers=["redis"]'          >> "$GITHUB_OUTPUT" ;;
            *)      echo "::error::unknown provider '$PROVIDER'"; exit 1 ;;
          esac

  benchmark:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      # Providers run concurrently. They used to be serialised, on the theory
      # that they would otherwise compete for the same CPU - but matrix legs
      # get a runner each, so they never shared one. The last serialised run
      # put memory on runner 1000003579 and redis on 1000003580, back to back,
      # for no benefit and twice the wall clock.
      #
      # Absolute throughput is not comparable across the two legs either way,
      # which is why every scenario is measured against a cache-disabled
      # baseline taken on its own runner, inside its own job.
      #
      # The workflow-level concurrency group still stops two *runs* overlapping.
      fail-fast: false
      matrix:
        provider: ${{ fromJSON(needs.plan.outputs.providers) }}

    services:
      redis:
        image: bitnami/redis:latest
        env:
          ALLOW_EMPTY_PASSWORD: yes
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Note: deliberately no `cache: pnpm`. setup-node keys the pnpm store
      # cache on OS + lockfile hash only, with no Node version, so every matrix
      # leg shares one store. That store holds compiled native addons, so a
      # better-sqlite3 built under one Node ABI gets restored under another and
      # crashes with "Assertion failed: (env) != nullptr". pnpm installs are
      # fast enough that correctness is the better trade.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - env:
          PROVIDER: ${{ matrix.provider }}
        run: pnpm run "postinstall:$PROVIDER"

      - run: pnpm run build

      - name: Record runner capacity
        run: |
          echo "cores: $(nproc)"
          free -m | head -2
          echo "kernel: $(uname -r)"

      - name: Run benchmarks
        env:
          DURATION: ${{ inputs.duration }}
          CONNECTIONS: ${{ inputs.connections }}
          PIPELINING: ${{ inputs.pipelining }}
          PROVIDER: ${{ matrix.provider }}
        run: |
          node scripts/benchmark.mjs \
            --provider "$PROVIDER" \
            --duration "$DURATION" \
            --connections "$CONNECTIONS" \
            --pipelining "$PIPELINING" \
            --json "bench-$PROVIDER.json" \
            --markdown "bench-$PROVIDER.md"

      - name: Publish to run summary
        env:
          PROVIDER: ${{ matrix.provider }}
        run: cat "bench-$PROVIDER.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmarks-${{ matrix.provider }}
          path: |
            bench-${{ matrix.provider }}.json
            bench-${{ matrix.provider }}.md
          retention-days: 30

  update-docs:
    needs: benchmark
    if: ${{ inputs.update_docs && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: benchmarks-*
          path: artifacts
          merge-multiple: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Assemble BENCHMARKS.md
        run: |
          set -euo pipefail
          # Built from the per-provider JSON, not by concatenating their
          # markdown. Concatenating produced one file with two `# Benchmarks`
          # titles and two Context blocks, where the redis half read as a stray
          # section of the memory report - and comparing one scenario across
          # providers meant scrolling between two tables.
          node scripts/assemble-benchmarks.mjs artifacts --out BENCHMARKS.md
          echo "--- assembled ---"
          grep -E '^#{1,2} ' BENCHMARKS.md

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          PROVIDER: ${{ inputs.provider }}
          DURATION: ${{ inputs.duration }}
          CONNECTIONS: ${{ inputs.connections }}
          PIPELINING: ${{ inputs.pipelining }}
        run: |
          if git diff --quiet -- BENCHMARKS.md; then
            echo "BENCHMARKS.md unchanged, nothing to open"
            exit 0
          fi

          BRANCH="bench/results-${RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add BENCHMARKS.md
          git commit -m "docs: refresh benchmarks (run ${RUN_ID})"
          git push origin "$BRANCH"

          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "$BRANCH" \
            --title "docs: refresh benchmarks" \
            --body "$(printf '%s\n' \
              "Automated benchmark run [\`${RUN_ID}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID})." \
              "" \
              "| Setting | Value |" \
              "|---|---|" \
              "| Provider | \`${PROVIDER}\` |" \
              "| Duration | ${DURATION}s per scenario |" \
              "| Connections | ${CONNECTIONS} |" \
              "| Pipelining | ${PIPELINING} |" \
              "" \
              "Absolute throughput on shared CI hardware is not comparable between runs." \
              "Scenarios within a single run execute back to back on one machine, so the" \
              "**ratio between cache-off and cache-on** is the number worth reviewing.")"
